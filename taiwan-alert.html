<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taiwan Alert — live CWA hazard information in English, 中文, 日本語</title>
<meta name="color-scheme" content="light">
<style>
/* ---------------------------------------------------------------------
   Light theme: a civil-defence notice printed on paper. Warm off-white
   stock, ink-black type, hairline rules, and severity colour as the only
   saturated thing anywhere on the page.
   --------------------------------------------------------------------- */
:root{
  --paper:#F5F3EE; --bg:#F5F3EE; --bg2:#EDEAE2; --panel:#FFFFFF; --panel2:#FAF8F3;
  --line:rgba(17,22,27,.11); --line2:rgba(17,22,27,.24);
  --ink:#14191E; --ink2:#4E5A65; --ink3:#5C6771;
  --severe:#C4190B; --warning:#AD5A00; --advisory:#836200; --info:#1A6CB5;
  --none:#E4E8EC; --none-line:#B4BEC7;
  --focus:#1A6CB5;
  --font:"Avenir Next","Avenir","Segoe UI","PingFang TC","Hiragino Sans","Noto Sans TC","Noto Sans JP",sans-serif;
  --mono:"SF Mono",ui-monospace,"JetBrains Mono","IBM Plex Mono",Menlo,"Roboto Mono",monospace;
  --shadow:0 1px 2px rgba(20,25,30,.06);
  --r:14px;
  --maxw:1160px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font);
  font-size:15px; line-height:1.5; letter-spacing:.005em;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
  background-image:
    radial-gradient(1100px 560px at 50% -12%, rgba(26,108,181,.08), transparent 62%),
    repeating-linear-gradient(0deg, rgba(17,22,27,.017) 0 1px, transparent 1px 3px);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--info);text-underline-offset:2px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.micro{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}

/* ---------- header ---------- */
header.top{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg, rgba(245,243,238,.98), rgba(245,243,238,.88));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:var(--maxw);margin:0 auto;padding:10px 16px;
  padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;min-width:0}
.brand .mark{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--ink);
  border:1px solid var(--ink);border-radius:4px;padding:3px 6px 2px}
.brand .sub{font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{padding:5px 9px;font-size:12px;color:var(--ink2);line-height:1.2}
.seg button[aria-pressed="true"]{background:var(--ink);color:#FCFBF8;font-weight:600}
.seg button+button{border-left:1px solid var(--line2)}
.srcbtn{display:flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:8px;
  padding:5px 10px;font-size:12px;color:var(--ink2);background:var(--panel)}
.srcbtn .dot{width:7px;height:7px;border-radius:50%;background:var(--ink3)}
body.src .srcbtn{border-color:var(--info);color:var(--info)}
body.src .srcbtn .dot{background:var(--info);box-shadow:0 0 0 3px rgba(26,108,181,.16)}

/* ---------- generic blocks ---------- */
main{padding-top:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.pad{padding:14px}
.sect{margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.sect .line{flex:1;height:1px;background:var(--line2)}
.grid{display:grid;gap:12px}
@media(min-width:900px){ .cols{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start} }

/* ---------- severity ---------- */
.sev-severe{--sev:var(--severe)} .sev-warning{--sev:var(--warning)}
.sev-advisory{--sev:var(--advisory)} .sev-info{--sev:var(--info)} .sev-none{--sev:var(--none-line)}
.sevchip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:0 0 auto;
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--sev);
  border:1px solid color-mix(in srgb, var(--sev) 42%, transparent);
  background:color-mix(in srgb, var(--sev) 9%, #FFFFFF);border-radius:999px;padding:3px 8px 2px}
.hero{border-radius:var(--r);border:1px solid color-mix(in srgb, var(--sev) 32%, var(--line));
  background:linear-gradient(135deg, color-mix(in srgb, var(--sev) 11%, #FFFFFF), var(--panel) 72%);
  padding:14px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow)}
.hero .bar{width:4px;align-self:stretch;border-radius:2px;background:var(--sev)}
.hero .word{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1;color:var(--sev)}
.hero .where{font-size:13px;color:var(--ink2);margin-top:3px}
@media(min-width:420px){ .hero .word{font-size:30px} }

/* ---------- alert card ---------- */
.alert{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);
  border-left:3px solid var(--sev);border-radius:12px;padding:12px 13px;box-shadow:var(--shadow);
  transition:background .15s ease, transform .15s ease}
.alert:hover{background:var(--panel2)}
.alert:active{transform:scale(.995)}
.alert h3{font-size:16px;line-height:1.3;margin:6px 0 0}
.alert .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.alert .body{font-size:13.5px;color:var(--ink2);margin-top:6px}
.chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink2);
  border:1px solid var(--line2);background:var(--bg2);border-radius:5px;padding:3px 6px 2px;white-space:nowrap}
.chip.me{border-color:var(--ink);color:var(--ink);background:#FFFFFF}
.chip.ghost{border-style:dashed;color:var(--ink3);background:transparent}
.time{font-family:var(--mono);font-size:11px;color:var(--ink3);letter-spacing:.02em}

/* ---------- field rows ---------- */
.field{border-top:1px solid var(--line);padding:9px 0}
.field:first-child{border-top:0}
.field .row{display:flex;gap:12px;align-items:baseline;justify-content:space-between}
.field .k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);flex:0 0 auto}
.field .v{text-align:right;font-family:var(--mono);font-size:14px;letter-spacing:-.01em;min-width:0;word-break:break-word}
.field .v.txt{font-family:var(--font);font-size:14px}
.big{font-size:28px!important;line-height:1.1}

/* ---------- provenance ---------- */
.prov{display:none}
body.src .prov{
  display:block;margin:7px 0 2px;padding:8px 9px;border-radius:8px;
  border:1px solid rgba(26,108,181,.24);border-left:2px solid var(--info);
  background:rgba(26,108,181,.05);font-family:var(--mono);font-size:10.5px;line-height:1.55;color:#2B5473;
  overflow-wrap:anywhere;word-break:break-word}
.prov b{color:#123349;font-weight:600}
.prov .tag{display:inline-block;border:1px solid rgba(26,108,181,.42);border-radius:4px;padding:1px 5px;
  margin-right:6px;letter-spacing:.1em;text-transform:uppercase;font-size:9px;color:#155E9F}
.prov .tag.calc{border-color:rgba(131,98,0,.45);color:#7A5C00}
.prov .raw{color:var(--ink);background:rgba(17,22,27,.06);border-radius:3px;padding:0 4px;word-break:break-all}
.prov ul{margin:4px 0 0;padding-left:16px}
body.src .annotated{text-decoration:underline dotted rgba(26,108,181,.5);text-underline-offset:3px}

/* ---------- map ---------- */
.mapwrap{position:relative;background:linear-gradient(180deg,#CFE0EF,#C3D7E9);border-radius:var(--r);
  border:1px solid var(--line);overflow:hidden;box-shadow:var(--shadow)}
.mapwrap svg{display:block;width:100%;max-width:var(--mapmax,470px);height:auto;margin:0 auto}
@media(min-width:700px){ :root{--mapmax:560px} }
@media(min-width:1100px){ :root{--mapmax:720px} }

/* ---------- cinematic map layers ---------- */
.halo{opacity:.5}
.halo.pulse{animation:breathe 2.8s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.28}50%{opacity:.78}}
.county.rise{animation:riseIn .55s cubic-bezier(.2,.7,.3,1) both;transform-box:fill-box;transform-origin:50% 50%}
@keyframes riseIn{from{opacity:0;transform:translateY(7px) scale(.985)}to{opacity:1;transform:none}}
.grat{stroke:rgba(17,22,27,.12);stroke-width:.5;fill:none}
.tropic{stroke:rgba(17,22,27,.3);stroke-width:.7;stroke-dasharray:5 4;fill:none}
.tropiclabel{font-family:var(--mono);font-size:7.5px;fill:rgba(17,22,27,.5);letter-spacing:.08em}

/* ---------- time scrubber ---------- */
.tl{display:block;width:100%;height:auto}
.tlbar{rx:3}
.tlhead{stroke:var(--ink);stroke-width:1.4}
.tltick{stroke:rgba(17,22,27,.14);stroke-width:.6}
.tllabel{font-family:var(--mono);font-size:7.5px;fill:var(--ink3);letter-spacing:.06em}
.tlname{font-family:var(--mono);font-size:8px;fill:#FFFFFF;letter-spacing:.04em}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:var(--ink);border:3px solid var(--panel);box-shadow:0 1px 3px rgba(20,25,30,.35);margin-top:-7px}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line2)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--ink);border:3px solid var(--panel)}

/* ---------- seismograph network ---------- */
.stn .dot{transition:opacity .22s ease}
.waves-armed .stn .dot{opacity:.2}
.waves-armed .stn.hit .dot{opacity:1}
.stn .ping{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.waves-armed .stn.hit .ping{animation:ping .75s cubic-bezier(.2,.7,.3,1) 1}
@keyframes ping{from{opacity:.85;transform:scale(.4)}to{opacity:0;transform:scale(3.4)}}
.wavefront{pointer-events:none}
.wclock{font-family:var(--mono);font-size:9px;fill:var(--ink2);letter-spacing:.1em}

/* ---------- stage mode (press P) ---------- */
body.stage{padding-bottom:0;overflow:hidden}
body.stage header.top, body.stage nav.bottom{display:none}
body.stage main{padding:0}
body.stage .wrap{max-width:none;padding:0}
body.stage .mapwrap{border:0;border-radius:0;box-shadow:none;background:linear-gradient(180deg,#CFE0EF,#BED4E8)}
body.stage .mapwrap svg{max-width:none;width:100%;height:100vh;height:100dvh}
.stagebar{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;gap:20px;
  padding:18px 26px;background:linear-gradient(180deg,rgba(245,243,238,.96),rgba(245,243,238,0));pointer-events:none}
.stagebar .bar{width:6px;align-self:stretch;border-radius:3px;background:var(--sev);min-height:54px}
.stagebar .word{font-size:clamp(30px,4.4vw,62px);font-weight:600;letter-spacing:-.025em;line-height:1;color:var(--sev)}
.stagebar .where{font-size:clamp(14px,1.5vw,22px);color:var(--ink2);margin-top:6px}
.stagebar .right{margin-left:auto;text-align:right}
.stagefoot{position:fixed;bottom:0;left:0;right:0;z-index:60;display:flex;justify-content:space-between;
  gap:16px;padding:14px 26px;background:linear-gradient(0deg,rgba(245,243,238,.96),rgba(245,243,238,0));pointer-events:none}
.stagefoot .legend{background:transparent;border:0;padding:0}
.stagefoot .legend .li{font-size:11px}
.stagekey{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.county{cursor:pointer;transition:opacity .15s ease}
.county:hover{opacity:.82}
.maplabel{font-family:var(--mono);font-size:8.5px;fill:#3F4A55;letter-spacing:.1em;text-transform:uppercase}
.insetbox{fill:rgba(255,255,255,.4);stroke:rgba(17,22,27,.3);stroke-width:1;stroke-dasharray:3 3}
.legend{display:flex;flex-wrap:wrap;gap:8px;padding:9px 11px;border-top:1px solid var(--line);background:var(--bg2)}
.maphead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px 3px}
.wide-only{display:none}
@media(min-width:620px){ .wide-only{display:inline} }
@media(max-width:520px){ .brand .sub{display:none} }
.legend .li{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.legend .sw{width:10px;height:10px;border-radius:3px;border:1px solid rgba(17,22,27,.2)}
.scalebar{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;color:var(--ink3)}

/* ---------- nav ---------- */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:linear-gradient(180deg, rgba(245,243,238,.9), rgba(245,243,238,.99));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line2);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:var(--maxw);margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.nav-in button{padding:11px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.nav-in button[aria-current="page"]{color:var(--ink)}
.nav-in button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5}

/* ---------- misc ---------- */
.status{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:12px;
  border:1px solid var(--line);background:var(--panel);font-size:13.5px;color:var(--ink2);box-shadow:var(--shadow)}
.ds{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;color:var(--ink3);
  padding:6px 0;border-top:1px solid var(--line)}
.ds .pip{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.ok{background:#1E8A57} .bad{background:var(--severe)} .wait{background:var(--ink3)}
.note{font-size:12px;color:var(--ink3);line-height:1.55}
.disclaim{margin:26px 0 8px;padding:12px 13px;border:1px dashed var(--line2);border-radius:12px;
  font-size:11.5px;color:var(--ink3);line-height:1.6;background:rgba(255,255,255,.45)}
.backbtn{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);padding:7px 0}
.skel{background:linear-gradient(90deg,#EFEDE7,#F8F7F4,#EFEDE7);background-size:200% 100%;
  animation:sh 1.4s linear infinite;border-radius:10px}
@keyframes sh{to{background-position:-200% 0}}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
select{background:#FFFFFF;color:var(--ink);border:1px solid var(--line2);border-radius:8px;
  padding:6px 8px;font-size:12px;font-family:var(--mono)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-family:var(--mono);font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <span class="mark">TW·ALERT</span>
      <span class="sub" id="brandSub">Live CWA open data · unofficial</span>
    </div>
    <div class="seg" id="langSeg" role="group" aria-label="Language"></div>
    <button class="srcbtn" id="srcBtn" aria-pressed="false"><span class="dot"></span><span id="srcLabel">Show source</span></button>
  </div>
</header>
<main><div class="wrap" id="view"></div></main>
<nav class="bottom"><div class="nav-in" id="nav"></div></nav>
<script>
'use strict';
/* =====================================================================
   TAIWAN ALERT — one file, no dependencies, live CWA open data.
   Sections: 1 constants · 2 i18n · 3 utils · 4 translation · 5 severity
             6 fetch+normalise · 7 projection/maps · 8 views · 9 boot
   ===================================================================== */

/* ----------------------------- 1. CONSTANTS ------------------------- */

const CWA_KEY = 'rdec-key-123-45678-011121314';
const CWA_URL = id => `https://opendata.cwa.gov.tw/api/v1/rest/datastore/${id}?Authorization=${CWA_KEY}&format=JSON`;

const DATASETS = {
  warnCounty : { id:'W-C0033-001', kind:'weather',    desc:{en:'Weather warnings by county', zh:'天氣警特報-各縣市', ja:'気象警報（県市別）'} },
  warnText   : { id:'W-C0033-002', kind:'weather',    desc:{en:'Weather warning narrative', zh:'天氣警特報-內容', ja:'気象警報（本文）'} },
  quakeBig   : { id:'E-A0015-001', kind:'earthquake', desc:{en:'Significant earthquake reports', zh:'顯著有感地震報告', ja:'顕著な有感地震報告'} },
  quakeSmall : { id:'E-A0016-001', kind:'earthquake', desc:{en:'Small-area earthquake reports', zh:'小區域有感地震報告', ja:'小地域有感地震報告'} },
  typhoon    : { id:'W-C0034-005', kind:'typhoon',    desc:{en:'Tropical cyclone tracks', zh:'熱帶氣旋路徑', ja:'熱帯低気圧経路'} }
};

/* ISO 3166-2:TW ←→ the Chinese names CWA actually publishes. */
const COUNTIES = [
  { code:'TW-TPE', zh:'臺北市', en:'Taipei City',       ja:'台北市',   hallJa:'台北市役所' },
  { code:'TW-NWT', zh:'新北市', en:'New Taipei City',   ja:'新北市',   hallJa:'新北市役所' },
  { code:'TW-TAO', zh:'桃園市', en:'Taoyuan City',      ja:'桃園市',   hallJa:'桃園市役所' },
  { code:'TW-TXG', zh:'臺中市', en:'Taichung City',     ja:'台中市',   hallJa:'台中市役所' },
  { code:'TW-TNN', zh:'臺南市', en:'Tainan City',       ja:'台南市',   hallJa:'台南市役所' },
  { code:'TW-KHH', zh:'高雄市', en:'Kaohsiung City',    ja:'高雄市',   hallJa:'高雄市役所' },
  { code:'TW-KEE', zh:'基隆市', en:'Keelung City',      ja:'基隆市',   hallJa:'基隆市役所' },
  { code:'TW-HSZ', zh:'新竹市', en:'Hsinchu City',      ja:'新竹市',   hallJa:'新竹市役所' },
  { code:'TW-HSQ', zh:'新竹縣', en:'Hsinchu County',    ja:'新竹県',   hallJa:'新竹県庁' },
  { code:'TW-MIA', zh:'苗栗縣', en:'Miaoli County',     ja:'苗栗県',   hallJa:'苗栗県庁' },
  { code:'TW-CHA', zh:'彰化縣', en:'Changhua County',   ja:'彰化県',   hallJa:'彰化県庁' },
  { code:'TW-NAN', zh:'南投縣', en:'Nantou County',     ja:'南投県',   hallJa:'南投県庁' },
  { code:'TW-YUN', zh:'雲林縣', en:'Yunlin County',     ja:'雲林県',   hallJa:'雲林県庁' },
  { code:'TW-CYI', zh:'嘉義市', en:'Chiayi City',       ja:'嘉義市',   hallJa:'嘉義市役所' },
  { code:'TW-CYQ', zh:'嘉義縣', en:'Chiayi County',     ja:'嘉義県',   hallJa:'嘉義県庁' },
  { code:'TW-PIF', zh:'屏東縣', en:'Pingtung County',   ja:'屏東県',   hallJa:'屏東県庁' },
  { code:'TW-ILA', zh:'宜蘭縣', en:'Yilan County',      ja:'宜蘭県',   hallJa:'宜蘭県庁' },
  { code:'TW-HUA', zh:'花蓮縣', en:'Hualien County',    ja:'花蓮県',   hallJa:'花蓮県庁' },
  { code:'TW-TTT', zh:'臺東縣', en:'Taitung County',    ja:'台東県',   hallJa:'台東県庁' },
  { code:'TW-PEN', zh:'澎湖縣', en:'Penghu County',     ja:'澎湖県',   hallJa:'澎湖県庁' },
  { code:'TW-KIN', zh:'金門縣', en:'Kinmen County',     ja:'金門県',   hallJa:'金門県庁' },
  { code:'TW-LIE', zh:'連江縣', en:'Lienchiang County', ja:'連江県',   hallJa:'連江県庁' }
];
const BY_CODE = Object.fromEntries(COUNTIES.map(c => [c.code, c]));

/* CWA writes the orthodox 臺; plenty of prose uses 台. Index both, plus the
   sub-county descriptors that legitimately roll up to a county. */
const ZH_TO_CODE = (() => {
  const m = Object.create(null);
  for (const c of COUNTIES) {
    m[c.zh] = c.code;
    m[c.zh.replace(/臺/g, '台')] = c.code;
    m[c.zh.replace(/[縣市]$/, '')] = c.code;                       // 花蓮 → TW-HUA

  }
  m['恆春半島'] = 'TW-PIF';  m['恒春半島'] = 'TW-PIF';

})();

function t(key, vars) {
  const node = key.split('.').reduce((o, k) => (o || {})[k], STR);
  let s = (node && (node[state.lang] || node.en)) || key;
  if (vars) for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
  return s;
}

/* CWA gives the epicenter only in Chinese, in a fixed pattern:
   「臺東縣政府東南東方  43.0  公里 (位於臺灣東南部海域)」
   Distance is measured from the county government office, and the parenthetical
   often just repeats the county already named. Both matter. */
function parseEpicenter(locRaw) {
  const loc = String(locRaw || '').replace(/\s+/g, ' ').trim();
  const m = /^(.+?)政府([東西南北]+)方\s*([\d.]+)\s*公里\s*(?:[（(]\s*(.*?)\s*[)）])?\s*$/.exec(loc);
  const out = { ok: false, raw: locRaw, zh: loc, en: loc, ja: toShinjitai(loc), parts: {} };
  if (!m) return out;
  const [, countyZh, dirZh, distStr, parenRaw] = m;
  const code = ZH_TO_CODE[countyZh] || null;
  const county = code ? BY_CODE[code] : null;
  const dir = COMPASS_ZH[dirZh] || { en: dirZh, ja: dirZh };
  const dist = num(distStr);
  const hallEn = county ? county.en + ' Hall' : countyZh + ' government';
  const hallJa = county ? county.hallJa : toShinjitai(countyZh);

  /* The parenthetical: keep what it adds, drop what it repeats. */
  let tailEn = '', tailJa = '', untranslated = false, parenKept = null;
  const paren = (parenRaw || '').replace(/^位於/, '').trim();
  if (paren) {
    parenKept = paren;
    if (PLACE_TERMS[paren]) {
      tailEn = PLACE_TERMS[paren].en; tailJa = PLACE_TERMS[paren].ja;
    } else {
      let innerCode = null, innerZh = '', rest = paren;
      for (const c of COUNTIES) {
        for (const nameVariant of [c.zh, c.zh.replace(/臺/g, '台')]) {
          if (paren.startsWith(nameVariant)) { innerCode = c.code; innerZh = nameVariant; rest = paren.slice(nameVariant.length); }
        }
      }
      const sameCounty = innerCode && innerCode === code;
      if (innerCode && /^(近海|外海|沿海)$/.test(rest)) {
        tailEn = sameCounty ? 'offshore' : 'offshore ' + BY_CODE[innerCode].en;
        tailJa = sameCounty ? '沖合' : BY_CODE[innerCode].ja + '沖';
      } else if (innerCode && DISTRICT_TERMS[rest]) {
        tailEn = DISTRICT_TERMS[rest].en + (sameCounty ? '' : ', ' + BY_CODE[innerCode].en);
        tailJa = DISTRICT_TERMS[rest].ja + (sameCounty ? '' : '・' + BY_CODE[innerCode].ja);
      } else if (DISTRICT_TERMS[paren]) {
        tailEn = DISTRICT_TERMS[paren].en; tailJa = DISTRICT_TERMS[paren].ja;
      } else if (innerCode && rest === '') {
        tailEn = sameCounty ? '' : BY_CODE[innerCode].en;
        tailJa = sameCounty ? '' : BY_CODE[innerCode].ja;
      } else {
        untranslated = true;
        tailEn = paren; tailJa = toShinjitai(paren);
      }
    }
  }
  out.ok = true;
  out.zh = loc;
  out.en = `${dist != null ? dist.toFixed(1) : distStr} km ${dir.en} of ${hallEn}` + (tailEn ? ', ' + tailEn : '');
  out.ja = `${hallJa}の${dir.ja}${dist != null ? dist.toFixed(1) : distStr} km` + (tailJa ? '、' + tailJa : '');
  out.parts = { countyZh, countyCode: code, dirZh, dirEn: dir.en, distanceKm: dist, paren: parenKept, untranslated };
  return out;
}

function quakeSeverity(maxIdx, reportContent) {

/* Five datasets, fetched concurrently, each rendered the moment it lands.

const arr = x => Array.isArray(x) ? x : (x == null ? [] : [x]);

async function fetchDataset(key) {
  const ds = DATASETS[key];
  state.ds[key] = { status: 'loading', data: null, error: null, at: null };
  render();
  try {
    const res = await fetch(CWA_URL(ds.id), { mode: 'cors', cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);
    const json = await res.json();
    if (String(json.success) !== 'true') throw new Error('CWA envelope success = ' + fmtRaw(json.success));
    state.ds[key] = { status: 'ok', data: json, error: null, at: new Date() };
  } catch (err) {
    state.ds[key] = { status: 'error', data: null, error: (err && err.message) || String(err), at: new Date() };
  }

}
const loadAll = () => Object.keys(DATASETS).forEach(fetchDataset);

/* ---- weather: W-C0033-001 (counties) + W-C0033-002 (narrative) ---- */
function buildWeatherAlerts() {
  const byKey = new Map();
  const keyOf = (ph, s, e) => `${ph}|${s}|${e}`;

  const county = dsOk('warnCounty');
  if (county) {
    const locations = arr(county.records && county.records.location);
    for (const loc of locations) {
      const hazards = arr(loc.hazardConditions && loc.hazardConditions.hazards);
      /* 22 counties come back always; most carry an empty hazards array.
         Appearing in the response is not the same as having a warning. */
      for (const h of hazards) {
        const info = h.info || {}, vt = h.validTime || {};
        const k = keyOf(info.phenomena, vt.startTime, vt.endTime);
        if (!byKey.has(k)) byKey.set(k, {
          phenomena: info.phenomena, significance: info.significance,
          startTime: vt.startTime, endTime: vt.endTime,
          codes: new Set(), regions: [], narrative: null, rawCounty: [], rawText: null
        });
        const a = byKey.get(k);
        const r = resolveRegion(loc.locationName);
        if (r.code) a.codes.add(r.code);
        if (!a.regions.some(x => x.zh === r.zh)) a.regions.push(r);
        a.rawCounty.push({ locationName: loc.locationName, geocode: loc.geocode, hazard: h });
      }
    }
  }

  const text = dsOk('warnText');
  if (text) {
    for (const rec of arr(text.records && text.records.record)) {
      const di = rec.datasetInfo || {}, vt = di.validTime || {};
      /* contents.content is an object on some records and an array on others. */
      const contents = arr(rec.contents && rec.contents.content);
      const zh = contents.find(c => /zh/i.test(c.contentLanguage || '')) || contents[0] || null;
      const en = contents.find(c => /^en/i.test(c.contentLanguage || '')) || null;
      const hazards = arr(rec.hazardConditions && rec.hazardConditions.hazards && rec.hazardConditions.hazards.hazard);
      for (const h of hazards) {
        const info = h.info || {};
        const k = keyOf(info.phenomena, vt.startTime, vt.endTime);
        let a = byKey.get(k);
        if (!a) {
          /* Window boundaries can differ slightly between the two datasets. */
          for (const [, cand] of byKey) {
            if (cand.phenomena === info.phenomena) {
              const s1 = +parseCwaTime(cand.startTime), e1 = +parseCwaTime(cand.endTime);
              const s2 = +parseCwaTime(vt.startTime), e2 = +parseCwaTime(vt.endTime);
              if (s1 <= e2 && s2 <= e1) { a = cand; break; }
            }
          }
        }
        if (!a) {
          a = { phenomena: info.phenomena, significance: info.significance, startTime: vt.startTime,
            endTime: vt.endTime, codes: new Set(), regions: [], narrative: null, rawCounty: [], rawText: null };
          byKey.set(k, a);
        }
        a.issueTime = di.issueTime; a.updateTime = di.update;
        a.datasetDescription = di.datasetDescription;
        a.narrative = { zh: zh ? String(zh.contentText || '').trim() : null, zhLang: zh ? zh.contentLanguage : null,
                        en: en ? String(en.contentText || '').trim() : null, enLang: en ? en.contentLanguage : null };
        a.rawText = rec;
        for (const loc of arr(info.affectedAreas && info.affectedAreas.location)) {
          const r = resolveRegion(loc.locationName);
          if (r.code) a.codes.add(r.code);
          if (!a.regions.some(x => x.zh === r.zh)) a.regions.push(r);
        }
      }
    }
  }

  const out = [];
  for (const [k, a] of byKey) {
    const sev = weatherSeverity(a.phenomena);
    const start = parseCwaTime(a.startTime), end = parseCwaTime(a.endTime);
    out.push({
      id: 'wx:' + k, hazardType: 'weather', severity: sev.sev, severityBasis: sev,
      issuedAt: parseCwaTime(a.issueTime) || start, expiresAt: end, startsAt: start,
      affectedRegions: [...a.codes], regions: a.regions,
      payload: a, datasetIds: [DATASETS.warnCounty.id, DATASETS.warnText.id],
      sourceUrl: 'https://www.cwa.gov.tw/V8/' + (state.lang === 'en' ? 'E' : 'C') + '/W/Warning/Warning.html',
      raw: { fromWarnCounty: a.rawCounty, fromWarnText: a.rawText }
    });
  }
  return out;
}

function readShakingArea(eq) {
  const rows = arr(eq.Intensity && eq.Intensity.ShakingArea);
  /* Authoritative rows carry InfoStatus:"observe" and one county each; the rest
     are summary rows ("最大震度4級地區") whose CountyName is a 、-joined list. */
  const observe = rows.filter(r => r.InfoStatus === 'observe');
  const use = observe.length ? observe : rows;
  const byCounty = new Map();
  for (const r of use) {
    const idx = intensityIndex(r.AreaIntensity);
    if (idx < 0) continue;
    for (const nm of String(r.CountyName || '').split(/[、,]/).map(s => s.trim()).filter(Boolean)) {
      const res = resolveRegion(nm);
      if (!res.code) continue;
      if (!byCounty.has(res.code) || byCounty.get(res.code) < idx) byCounty.set(res.code, idx);
    }

/* ---- tropical cyclones: W-C0034-005 ---- */
function buildCyclones() {
  const d = dsOk('typhoon'); if (!d) return [];
  const list = arr(d.records && d.records.TropicalCyclones && d.records.TropicalCyclones.TropicalCyclone);
  const now = state.now;
  return list.map((tc, i) => {
    const fixes = arr(tc.AnalysisData && tc.AnalysisData.Fix).map(f => ({
      time: parseCwaTime(f.DateTime), lat: num(f.CoordinateLatitude), lon: num(f.CoordinateLongitude),
      wind: num(f.MaxWindSpeed), gust: num(f.MaxGustSpeed), pressure: num(f.Pressure),
      moveSpeed: num(f.MovingSpeed), moveDir: f.MovingDirection,
      r15: num(f.Circle15ms && f.Circle15ms.Radius), r25: num(f.Circle25ms && f.Circle25ms.Radius),
      prediction: arr(f.MovingPrediction).reduce((o, p) => (o[/en/i.test(p.lang) ? 'en' : 'zh'] = p.value, o), {}),
      raw: f
    })).filter(f => f.time && f.lat != null && f.lon != null).sort((a, b) => a.time - b.time);
    const forecast = arr(tc.ForecastData && tc.ForecastData.Fix).map(f => {
      const init = parseCwaTime(f.InitialTime), hr = num(f.ForecastHour);
      return {
        initTime: init, hour: hr, time: init && hr != null ? new Date(+init + hr * 3600e3) : null,
        lat: num(f.CoordinateLatitude), lon: num(f.CoordinateLongitude),
        wind: num(f.MaxWindSpeed), gust: num(f.MaxGustSpeed), pressure: num(f.Pressure),
        moveSpeed: num(f.MovingSpeed), moveDir: f.MovingDirection,
        r15: num(f.Circle15ms && f.Circle15ms.Radius), r25: num(f.Circle25ms && f.Circle25ms.Radius),
        r70: num(f.Radius70PercentProbability),
        stateTransfer: arr(f.StateTransfer).reduce((o, p) => (o[/en/i.test(p.lang) ? 'en' : 'zh'] = p.value, o), {}),
        raw: f
      };
    }).filter(f => f.lat != null && f.lon != null).sort((a, b) => (a.hour || 0) - (b.hour || 0));

    const latest = fixes[fixes.length - 1] || null;
    const ageH = latest ? (now - latest.time) / 3600e3 : Infinity;
    const stale = !(ageH < 12);           /* last known track is served long after a storm has gone */
    const dTw = latest ? distanceToTaiwan(latest.lat, latest.lon) : { km: null, nearest: null };
    const edge = latest && dTw.km != null ? dTw.km - (latest.r15 || 0) : null;
    let min24 = null, min24At = null;
    for (const f of forecast) {
      if (!f.time || f.time - now > 24 * 3600e3 || (f.hour != null && f.hour > 24)) continue;
      const dd = distanceToTaiwan(f.lat, f.lon).km;
      if (min24 == null || dd < min24) { min24 = dd; min24At = f; }
    }
    const near = !stale && ((edge != null && edge <= 300) || (min24 != null && min24 <= 300));
    const bear = latest ? bearingDeg(TW_CENTROID.lat, TW_CENTROID.lon, latest.lat, latest.lon) : null;
    return {
      idx: i, nameEn: tc.TyphoonName, nameZh: tc.CwaTyphoonName, tyNo: tc.CwaTyNo, tdNo: tc.CwaTdNo, year: tc.Year,
      fixes, forecast, latest, stale, ageH, distanceKm: dTw.km, nearestCode: dTw.nearest,
      edgeKm: edge, min24Km: min24, min24At, near, bearing: bear,
      bearingPoint: bear != null ? bearingPoint(bear) : null,
      proximityBasis: {
        rule: rule('proximity'),
        inputs: [
          { label: 'latest fix → nearest Taiwan coast', value: dTw.km != null ? Math.round(dTw.km) + ' km' : null },
          { label: '15 m/s wind radius', value: latest ? latest.raw.Circle15ms && latest.raw.Circle15ms.Radius : null, ds: DATASETS.typhoon.id, path: 'AnalysisData.Fix[last].Circle15ms.Radius' },
          { label: 'distance minus wind radius', value: edge != null ? Math.round(edge) + ' km' : null },
          { label: 'closest forecast position ≤24 h', value: min24 != null ? Math.round(min24) + ' km' : 'none within 24 h' },
          { label: 'latest fix age', value: isFinite(ageH) ? ageH.toFixed(1) + ' h' : 'unknown' }
        ]

      raw: tc
    };
  });
}
function cycloneToAlert(c) {
  const f = c.latest;
  const reach25 = f && c.distanceKm != null && f.r25 != null && c.distanceKm <= f.r25;
  const reach15 = f && c.distanceKm != null && f.r15 != null && c.distanceKm <= f.r15;
  const sev = reach25 ? 'severe' : reach15 ? 'warning' : 'advisory';
  const codes = new Set();
  if (f && f.r15) {
    for (const [la, lo, code] of TW_VERTICES) if (haversine(f.lat, f.lon, la, lo) <= f.r15 + 60) codes.add(code);
  }
  if (!codes.size && c.nearestCode) codes.add(c.nearestCode);
  return {
    id: 'ty:' + (c.nameEn || c.idx), hazardType: 'typhoon', severity: sev,
    severityBasis: { sev, rule: rule(reach25 ? 'ty25' : reach15 ? 'ty15' : 'ty300'), inputs: c.proximityBasis.inputs },
    issuedAt: f ? f.time : null, expiresAt: f ? new Date(+f.time + 12 * 3600e3) : null, startsAt: f ? f.time : null,
    affectedRegions: [...codes],
    regions: [...codes].map(code => ({ code, zh: BY_CODE[code].zh, sub: null, untranslated: false })),
    payload: c, datasetIds: [DATASETS.typhoon.id],
    sourceUrl: 'https://www.cwa.gov.tw/V8/' + (state.lang === 'en' ? 'E' : 'C') + '/P/Typhoon/TY_NEWS.html',
    raw: c.raw

}

function rebuild() {
  state.now = new Date();
  state.quakes = buildQuakes();
  state.cyclones = buildCyclones();
  const alerts = [
    ...buildWeatherAlerts(),
    ...state.quakes.map(quakeToAlert),
    ...state.cyclones.filter(c => c.near).map(cycloneToAlert)
  ];
  alerts.sort((a, b) => (SEV_RANK[b.severity] - SEV_RANK[a.severity]) || ((b.issuedAt || 0) - (a.issuedAt || 0)));
  state.alerts = alerts;
  if (state.quakeId == null || !state.quakes.some(q => q.id === state.quakeId)) {
    state.quakeId = state.quakes.length ? state.quakes[0].id : null;
  }

}
/* Everything that asks "is this in force?" asks it about the previewed
   moment, so the scrubber moves the whole app, not just the map. */
const viewNow = () => new Date(+state.now + state.previewMs);
const isActive = a => a.expiresAt ? (a.expiresAt > viewNow() && (!a.startsAt || a.startsAt <= viewNow())) : false;
const activeAlerts = () => state.alerts.filter(isActive);

  const m = new Map();
  for (const a of activeAlerts()) {
    for (const code of a.affectedRegions) {
      if (!m.has(code) || SEV_RANK[a.severity] > SEV_RANK[m.get(code)]) m.set(code, a.severity);

/* ------------------- 7. PROJECTION + MAP DRAWING -------------------- */
/* Written once. The home alert map, the shaking choropleth and the storm
   track all call it, so a county's shape is identical in all three. */

function makeProjection(bbox, w, h, pad) {
  const lat0 = (bbox.minLat + bbox.maxLat) / 2;
  const kx = Math.cos(rad(lat0));                       // equirectangular: squeeze longitude
  const dx = (bbox.maxLon - bbox.minLon) * kx;
  const dy = (bbox.maxLat - bbox.minLat);
  const s = Math.min((w - 2 * pad) / dx, (h - 2 * pad) / dy);
  const ox = (w - dx * s) / 2, oy = (h - dy * s) / 2;
  const X = lon => ox + (lon - bbox.minLon) * kx * s;
  const Y = lat => oy + (bbox.maxLat - lat) * s;
  return {
    X, Y, scale: s, kx, bbox, w, h,
    kmY: km => km / 110.574 * s,
    kmX: (km, atLat) => km / (111.320 * Math.cos(rad(atLat))) * kx * s,
    pxPerKm: 1 / 110.574 * s
  };
}
function featurePath(feature, proj) {
  const polys = feature.geometry.type === 'Polygon' ? [feature.geometry.coordinates] : feature.geometry.coordinates;
  let d = '';
  for (const poly of polys) {
    for (const ring of poly) {
      d += ring.map(([lon, lat], i) => (i ? 'L' : 'M') + proj.X(lon).toFixed(2) + ',' + proj.Y(lat).toFixed(2)).join(' ') + 'Z';
    }
  }
  return d;
}
function featureBBox(codes, padDeg) {
  const p = padDeg || 0;
  let minLon = 180, maxLon = -180, minLat = 90, maxLat = -90;
  for (const f of TW_GEO.features) {
    if (codes && !codes.includes(f.properties.code)) continue;
    const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
    for (const poly of polys) for (const ring of poly) for (const [lon, lat] of ring) {
      if (lon < minLon) minLon = lon; if (lon > maxLon) maxLon = lon;
      if (lat < minLat) minLat = lat; if (lat > maxLat) maxLat = lat;
    }
  }
  return { minLon: minLon - p, maxLon: maxLon + p, minLat: minLat - p, maxLat: maxLat + p };
}
/* Taiwan + Penghu. Kinmen and Lienchiang sit far outside it and get insets. */
const MAIN_BBOX = { minLon: 119.42, maxLon: 122.08, minLat: 21.82, maxLat: 25.38 };
const INSET_CODES = ['TW-KIN', 'TW-LIE'];
const MAIN_CODES = COUNTIES.map(c => c.code).filter(c => !INSET_CODES.includes(c));

/* One size table for every map, so a projector gets a bigger viewBox rather
   than a blown-up one: label and stroke sizes stay in the same user units. */
function mapSize() {
  if (state.stage) {
    const vw = (typeof window !== 'undefined') ? window.innerWidth : 1600;
    const vh = (typeof window !== 'undefined') ? window.innerHeight : 900;
    const H = 920;
    return { W: Math.round(H * Math.min(2.4, Math.max(1, vw / vh))), H, pad: 34 };
  }
  const w = (typeof window !== 'undefined') ? window.innerWidth : 390;
  if (w >= 1100) return { W: 700, H: 650, pad: 20 };
  if (w >= 700) return { W: 540, H: 500, pad: 15 };
  return { W: 390, H: 362, pad: 10 };
}
const CENTROIDS = (() => {
  const m = {};
  for (const f of TW_GEO.features) {
    const b = featureBBox([f.properties.code], 0);
    m[f.properties.code] = { lat: (b.minLat + b.maxLat) / 2, lon: (b.minLon + b.maxLon) / 2 };
  }
  return m;
})();

/* Sea, grain, graticule and the Tropic of Cancer — it runs straight through
   Chiayi and Hualien, and everyone here knows exactly where it is. */
function mapDefs(scale) {
  const k = Math.max(1, scale / 96);
  return `<defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#D8E7F4"/><stop offset="0.55" stop-color="#C7DAEC"/><stop offset="1" stop-color="#B6CCE3"/>
    </linearGradient>
    <radialGradient id="seaglow" cx="0.5" cy="0.32" r="0.72">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="${Math.min(4.5, 2.2 * k).toFixed(1)}" stdDeviation="${Math.min(6, 2.8 * k).toFixed(1)}" flood-color="#0E2236" flood-opacity="0.3"/>
    </filter>
    <filter id="halo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="${Math.min(9, 5 * k).toFixed(1)}"/>
    </filter>
  </defs>`;
}
function mapBackdrop(proj, W, H) {
  const g = [];
  g.push(`<rect x="0" y="0" width="${W}" height="${H}" fill="url(#sea)"></rect>`);
  g.push(`<rect x="0" y="0" width="${W}" height="${H}" fill="url(#seaglow)"></rect>`);
  g.push(`<rect x="0" y="0" width="${W}" height="${H}" filter="url(#grain)" opacity="0.055"></rect>`);
  const b = proj.bbox, lines = [];
  for (let lon = Math.ceil(b.minLon); lon <= b.maxLon; lon++)
    lines.push(`M${proj.X(lon).toFixed(1)},0 L${proj.X(lon).toFixed(1)},${H}`);
  for (let lat = Math.ceil(b.minLat); lat <= b.maxLat; lat++)
    lines.push(`M0,${proj.Y(lat).toFixed(1)} L${W},${proj.Y(lat).toFixed(1)}`);
  g.push(`<path class="grat" d="${lines.join(' ')}"></path>`);
  const tropic = 23.43928;
  if (tropic > b.minLat && tropic < b.maxLat) {
    const y = proj.Y(tropic).toFixed(1);
    g.push(`<path class="tropic" d="M0,${y} L${W},${y}"></path>`);
    if (W >= 500) g.push(`<text class="tropiclabel" x="${W - 8}" y="${(+y - 5).toFixed(1)}" text-anchor="end">23°26′ N · TROPIC OF CANCER</text>`);
  }

}
function drawHalos(codes, proj, halo) {
  if (!halo || !halo.size) return '';
  const paths = TW_GEO.features.filter(f => codes.includes(f.properties.code) && halo.has(f.properties.code)).map(f => {
    const h = halo.get(f.properties.code);
    return `<path class="halo${h.pulse ? ' pulse' : ''}" data-halo="${f.properties.code}" d="${featurePath(f, proj)}" fill="${h.color}"></path>`;
  });

}

    .sort((a, b) => (a.properties.code === selected ? 1 : 0) - (b.properties.code === selected ? 1 : 0));
  return feats.map(f => {
    const code = f.properties.code;

    <rect class="insetbox" x="0.5" y="0.5" width="${w - 1}" height="${h - 1}" rx="5"></rect>

/* The nationwide alert map: every county filled by its highest active severity. */
function taiwanAlertMap(fills, selected, opts) {
  const o = opts || {};

/* The storm track map: same projection code, same county geometry. */
function typhoonMap(c, W, H, out) {
  const pts = [...c.fixes.slice(-14), ...c.forecast].filter(p => p.lat != null);
  const twPad = 0.55;
  const twBox = { minLon: MAIN_BBOX.minLon - twPad, maxLon: MAIN_BBOX.maxLon + twPad,

  let box = { ...twBox }, mode = 'both';
  for (const p of pts) {
    box.minLon = Math.min(box.minLon, p.lon - 1.2); box.maxLon = Math.max(box.maxLon, p.lon + 1.2);
    box.minLat = Math.min(box.minLat, p.lat - 1.2); box.maxLat = Math.max(box.maxLat, p.lat + 1.2);
  }
  let proj = makeProjection(box, W, H, 12);
  /* Never let Taiwan shrink to an unrecognisable speck to fit a distant storm. */
  const twWidthPx = (MAIN_BBOX.maxLon - MAIN_BBOX.minLon) * proj.kx * proj.scale;
  if (twWidthPx < W * 0.3) { mode = 'taiwan'; proj = makeProjection(twBox, W, H, 12); }
  if (out) out.mode = mode;

  const fills = new Map();
  const counties = drawCounties(COUNTIES.map(x => x.code), proj, fills, null, false);

  let g = '';
  {
    const obs = c.fixes.filter(f => f.lat != null);
    if (obs.length > 1) {
      g += `<path d="${obs.map((f, i) => (i ? 'L' : 'M') + proj.X(f.lon).toFixed(1) + ',' + proj.Y(f.lat).toFixed(1)).join(' ')}"
        fill="none" stroke="#1A6CB5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".92"></path>`;
    }
    for (const f of obs) g += `<circle cx="${proj.X(f.lon).toFixed(1)}" cy="${proj.Y(f.lat).toFixed(1)}" r="2" fill="#1A6CB5" opacity=".7"></circle>`;
    const fc = c.forecast.filter(f => f.lat != null);
    if (c.latest && fc.length) {
      const chain = [c.latest, ...fc];
      g += `<path d="${chain.map((f, i) => (i ? 'L' : 'M') + proj.X(f.lon).toFixed(1) + ',' + proj.Y(f.lat).toFixed(1)).join(' ')}"
        fill="none" stroke="#C2660A" stroke-width="2" stroke-dasharray="6 5" stroke-linecap="round" opacity=".95"></path>`;
      for (const f of fc) {
        g += `<circle cx="${proj.X(f.lon).toFixed(1)}" cy="${proj.Y(f.lat).toFixed(1)}" r="3" fill="#FFFFFF" stroke="#C2660A" stroke-width="1.5"></circle>`;
        g += `<text class="maplabel" x="${(proj.X(f.lon) + 6).toFixed(1)}" y="${(proj.Y(f.lat) - 5).toFixed(1)}" fill="#A85800">+${f.hour}H</text>`;
      }
    }
    const f = c.latest;
    if (f) {
      const cx = proj.X(f.lon), cy = proj.Y(f.lat);
      if (f.r15) g += `<ellipse cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" rx="${proj.kmX(f.r15, f.lat).toFixed(1)}" ry="${proj.kmY(f.r15).toFixed(1)}"
        fill="rgba(26,108,181,.10)" stroke="rgba(26,108,181,.5)" stroke-width="1"></ellipse>`;
      if (f.r25) g += `<ellipse cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" rx="${proj.kmX(f.r25, f.lat).toFixed(1)}" ry="${proj.kmY(f.r25).toFixed(1)}"
        fill="rgba(196,25,11,.1)" stroke="rgba(196,25,11,.6)" stroke-width="1"></ellipse>`;
      g += `<g transform="translate(${cx.toFixed(1)},${cy.toFixed(1)})">
        <circle r="5.5" fill="#C4190B" stroke="#FFFFFF" stroke-width="1.4"></circle>
        <circle r="10.5" fill="none" stroke="#C4190B" stroke-width="1.2" opacity=".6"></circle>
        </g>`;
    }
  }
  const lf = c.latest;
  const offFrame = !lf || proj.X(lf.lon) < 6 || proj.X(lf.lon) > W - 6 || proj.Y(lf.lat) < 6 || proj.Y(lf.lat) > H - 6;
  if (out) out.offFrame = offFrame;
  if (offFrame) {
    /* Storm is off-frame: keep Taiwan readable, point at the storm instead. */
    const cx = proj.X(TW_CENTROID.lon), cy = proj.Y(TW_CENTROID.lat);
    const th = rad(c.bearing || 0);
    const dx = Math.sin(th), dy = -Math.cos(th);
    const len = Math.min(W, H) * 0.42;
    const ex = cx + dx * len, ey = cy + dy * len;
    g += `<line x1="${cx.toFixed(1)}" y1="${cy.toFixed(1)}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}"
      stroke="#C2660A" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"></line>`;
    const mx = cx + dx * len * 0.56 - dy * 13, my = cy + dy * len * 0.56 + dx * 13;
    g += `<text class="maplabel" x="${Math.max(50, Math.min(W - 50, mx)).toFixed(1)}" y="${Math.max(14, Math.min(H - 14, my)).toFixed(1)}"
      fill="#8F4A00" text-anchor="middle" stroke="#D5E3F0" stroke-width="3.5" paint-order="stroke" style="font-size:9.5px">
      ${esc(t('stormArrow', { name: cycloneName(c), d: c.distanceKm != null ? Math.round(c.distanceKm) : '?', dir: dirLabel(c.bearingPoint) }))}</text>`;
  }
  /* scale bar */
  const targetPx = W * 0.22;
  let km = 50; const steps = [25, 50, 100, 200, 300, 500, 800, 1200, 2000];
  for (const s of steps) if (proj.pxPerKm * s <= targetPx) km = s;
  const barPx = proj.pxPerKm * km;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="storm track">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#C2660A"></path></marker>
    </defs>
    ${counties}${g}
    <g transform="translate(14,${H - 16})">
      <line x1="0" y1="0" x2="${barPx.toFixed(1)}" y2="0" stroke="var(--ink3)" stroke-width="1.5"></line>
      <line x1="0" y1="-4" x2="0" y2="4" stroke="var(--ink3)" stroke-width="1.5"></line>
      <line x1="${barPx.toFixed(1)}" y1="-4" x2="${barPx.toFixed(1)}" y2="4" stroke="var(--ink3)" stroke-width="1.5"></line>
      <text class="maplabel" x="${(barPx + 6).toFixed(1)}" y="3.5">${km} KM</text>
    </g>
  </svg>`;
}
const moveDirLabel = code => {
  const cp = COMPASS.find(x => x[1] === String(code || '').toUpperCase());
  return cp ? dirLabel(cp) : (code || '—');
};
const dirLabel = cp => cp ? (state.lang === 'en' ? cp[1] : state.lang === 'ja' ? cp[2] : cp[0]) : '—';
function cycloneName(c) {
  const en = c.nameEn ? c.nameEn.charAt(0) + c.nameEn.slice(1).toLowerCase() : '—';
  if (state.lang === 'zh') return `${c.nameZh || en}${c.nameZh ? `（${c.nameEn}）` : ''}`;
  if (state.lang === 'ja') return `${toShinjitai(c.nameZh || '')}${c.nameZh ? `（${c.nameEn}）` : en}`;

}

function regionNames(a, max) {
  const names = [];
  for (const code of a.affectedRegions) names.push(countyLabel(code));
  for (const r of (a.regions || [])) if (!r.code) names.push(regionLabel(r));
  const uniq = [...new Set(names)];
  if (max && uniq.length > max) return uniq.slice(0, max).join(t('listSep')) + ` +${uniq.length - max}`;
  return uniq.join(t('listSep'));
}
function alertHeadline(a) {
  if (a.hazardType === 'weather') {
    return t('weatherHeadline', { p: phenomenonLabel(a.payload.phenomena), areas: regionNames(a, 3) || '—' });
  }
  if (a.hazardType === 'earthquake') {
    const q = a.payload;
    return t('quakeHeadline', { m: q.magnitude != null ? q.magnitude.toFixed(1) : '—',
      i: intensityLabel(q.maxIdx), c: q.maxCode ? countyLabel(q.maxCode) : '—' });
  }

}
/* Assume the official English is missing — it usually is. Every alert gets a

function alertProv(a) {

  if (a.hazardType === 'weather') {
    src = annot({ ds: DATASETS.warnCounty.id + ' + ' + DATASETS.warnText.id,
      path: 'records.location[].hazardConditions.hazards[].info.phenomena · .validTime · records.record[].hazardConditions.hazards.hazard[].info.affectedAreas.location[].locationName',
      raw: { phenomena: p.phenomena, significance: p.significance, startTime: p.startTime, endTime: p.endTime },
      issued: a.issuedAt, url: a.sourceUrl });

      raw: { OriginTime: ei.OriginTime, MagnitudeValue: ei.EarthquakeMagnitude && ei.EarthquakeMagnitude.MagnitudeValue,

/* A Gantt of every validity window CWA published, with a draggable playhead. */
function timelineWindow() {
  const t0 = +state.now;
  let t1 = t0 + 6 * 3600e3;
  for (const a of state.alerts) if (a.expiresAt && +a.expiresAt > t1) t1 = Math.min(+a.expiresAt + 3600e3, t0 + 48 * 3600e3);
  return { t0, t1 };
}
function timelineCard() {
  const { t0, t1 } = timelineWindow();
  const span = Math.max(1, t1 - t0);
  const rows = state.alerts.filter(a => a.expiresAt && +a.expiresAt > t0)
    .sort((a, b) => SEV_RANK[b.severity] - SEV_RANK[a.severity]).slice(0, 8);
  const W = 390, rowH = 19, top = 16, H = top + Math.max(1, rows.length) * rowH + 16;
  const X = ms => 6 + (Math.min(Math.max(ms, t0), t1) - t0) / span * (W - 12);
  let g = '';
  for (let h = 0; h <= 48; h += 3) {
    const ms = t0 + h * 3600e3; if (ms > t1) break;
    g += `<line class="tltick" x1="${X(ms).toFixed(1)}" y1="10" x2="${X(ms).toFixed(1)}" y2="${H - 12}"></line>`;
    const lx = X(ms);
    if (lx > 16 && lx < W - 16) g += `<text class="tllabel" x="${lx.toFixed(1)}" y="8" text-anchor="middle">${esc(fmtClock(new Date(ms)))}</text>`;
  }
  rows.forEach((a, i) => {
    const y = top + i * rowH, x0 = X(+(a.startsAt || state.now)), x1 = X(+a.expiresAt);
    const w = Math.max(3, x1 - x0);
    g += `<rect class="tlbar" x="${x0.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${rowH - 6}"
      fill="${sevHex(a.severity)}" opacity=".9" rx="3"></rect>`;
    if (w > 60) g += `<text class="tlname" x="${(x0 + 5).toFixed(1)}" y="${(y + rowH - 11).toFixed(1)}">${esc(
      a.hazardType === 'weather' ? phenomenonLabel(a.payload.phenomena)
      : a.hazardType === 'earthquake' ? 'M' + (a.payload.magnitude != null ? a.payload.magnitude.toFixed(1) : '?')
      : cycloneName(a.payload))}</text>`;
  });
  const px = X(t0 + state.previewMs);
  g += `<line class="tlhead" id="tlHead" x1="${px.toFixed(1)}" y1="10" x2="${px.toFixed(1)}" y2="${H - 12}"></line>`;
  return `<div class="card pad">
    <div class="maphead" style="padding:0 0 6px">
      <span class="micro">${esc(t('timeline'))}</span>
      <span class="micro" id="tlLabel">${state.previewMs ? esc(fmtDT(viewNow())) : esc(t('nowBtn'))}</span>
    </div>
    <svg class="tl" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${g}</svg>
    <div style="display:flex;gap:10px;align-items:center;margin-top:2px">
      <input type="range" min="0" max="1000" step="1" value="${Math.round(state.previewMs / span * 1000)}"
        data-action="scrub" data-span="${span}" aria-label="${esc(t('timeline'))}">
      <button class="chip" data-action="now">${esc(t('nowBtn'))}</button>
    </div>
    <div class="note">${esc(t('scrubHint'))}</div>
    ${annot({ computed: true, rule: rule('timeline'),
      inputs: rows.map(a => ({ label: alertHeadline(a), value: fmtDTp(a.startsAt) + ' → ' + fmtDTp(a.expiresAt) })) })}
  </div>`;
}
/* Scrubbing repaints fills and the playhead only — no re-render, no jank. */
function applyPreview() {
  const sevMap = severityByCounty();
  document.querySelectorAll('[data-county]').forEach(el => {
    const code = el.getAttribute('data-county');
    el.setAttribute('fill', sevMap.has(code) ? sevHex(sevMap.get(code)) : 'var(--none)');
  });
  document.querySelectorAll('[data-halo]').forEach(el => {
    const code = el.getAttribute('data-halo');
    const on = sevMap.has(code);
    el.setAttribute('fill', on ? sevHex(sevMap.get(code)) : 'transparent');
    el.style.opacity = on ? '' : '0';
  });
  const mine = activeAlerts().filter(a => a.affectedRegions.includes(state.county));
  const top = mine.length ? worstOf(mine.map(a => a.severity)) : 'none';
  const hero = document.getElementById('heroCard');
  if (hero) {
    hero.className = 'hero sev-' + (top === 'none' ? 'none' : top);
    const w = hero.querySelector('.word'), wh = hero.querySelector('.where');
    if (w) { w.textContent = top === 'none' ? t('sev.none') : sevLabel(top); w.style.color = top === 'none' ? 'var(--ink)' : ''; }
    if (wh) wh.textContent = countyLabel(state.county) + (mine.length ? ' · ' + t('nActive', { n: mine.length }) : '');
  }
  const { t0, t1 } = timelineWindow();
  const head = document.getElementById('tlHead');
  if (head) {
    const x = 6 + Math.min(1, state.previewMs / Math.max(1, t1 - t0)) * (390 - 12);
    head.setAttribute('x1', x.toFixed(1)); head.setAttribute('x2', x.toFixed(1));
  }
  const lab = document.getElementById('tlLabel');
  if (lab) lab.textContent = state.previewMs ? fmtDT(viewNow()) : t('nowBtn');
  const banner = document.getElementById('previewBanner');
  if (banner) {
    banner.style.display = state.previewMs ? '' : 'none';
    banner.textContent = t('projected', { t: fmtFull(viewNow()) });
  }
}

/* The epicenter, the wave fronts and every station that felt it. */
function quakeExtra(q) {
  return proj => {
    if (q.lat == null || q.lon == null) return '';
    const k = proj.scale / 96;
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const inside = q.lon >= MAIN_BBOX.minLon && q.lon <= MAIN_BBOX.maxLon && q.lat >= MAIN_BBOX.minLat && q.lat <= MAIN_BBOX.maxLat;
    const ex = clamp(proj.X(q.lon), 14 * k, proj.w - 14 * k), ey = clamp(proj.Y(q.lat), 14 * k, proj.h - 14 * k);

    const stations = (q.stations || []).map(st => {
      const x = proj.X(st.lon), y = proj.Y(st.lat);
      if (x < -20 || y < -20 || x > proj.w + 20 || y > proj.h + 20) return '';
      const r = Math.min(7, 1.5 + Math.sqrt(Math.max(0, st.pga || 0)) / 2.4) * k;
      const col = st.idx >= 0 ? INTENSITY_COLOR[st.idx] : '#9FC4E4';
      const d = st.dist != null ? st.dist : haversine(q.lat, q.lon, st.lat, st.lon);
      return `<g class="stn" data-sdist="${d.toFixed(1)}" transform="translate(${x.toFixed(1)},${y.toFixed(1)})">
        <circle class="ping" r="${(r * 1.6).toFixed(1)}" fill="none" stroke="${col}" stroke-width="${(1.4 * k).toFixed(1)}"></circle>
        <circle class="dot" r="${r.toFixed(1)}" fill="${col}" stroke="#FFFFFF" stroke-width="${(0.9 * k).toFixed(1)}"></circle>
        <title>${esc(st.name || st.id)} · ${esc(intensityLabel(st.idx))} · PGA ${st.pga != null ? st.pga.toFixed(1) : '—'} gal · ${d.toFixed(1)} km</title>
      </g>`;
    }).join('');

    /* Each front is a disc filled with a radial gradient: transparent at the
       centre, brightening to the leading edge, feathered just outside it. The
       stops are re-computed every frame so the trail keeps a constant width in
       KILOMETRES while the radius grows, and the whole thing dims as the
       energy spreads. */
    const grad = (id, col) => `<radialGradient id="${id}" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="${col}" stop-opacity="0"></stop>
        <stop offset="0.55" stop-color="${col}" stop-opacity="0"></stop>
        <stop offset="0.8" stop-color="${col}" stop-opacity="0"></stop>
        <stop offset="0.985" stop-color="${col}" stop-opacity="0"></stop>
        <stop offset="1" stop-color="${col}" stop-opacity="0"></stop>
      </radialGradient>`;
    const waves = `<g class="waveg" data-waves="${proj.pxPerKm.toFixed(5)}" transform="translate(${ex.toFixed(1)},${ey.toFixed(1)})">
        <defs>${grad('wgP', '#1A6CB5')}${grad('wgS', '#C4190B')}</defs>
        <circle class="wavefront pwave" r="0" fill="url(#wgP)" stroke="#1A6CB5" stroke-width="${(1.2 * k).toFixed(1)}" stroke-opacity="0"></circle>
        <circle class="wavefront swave" r="0" fill="url(#wgS)" stroke="#C4190B" stroke-width="${(1.6 * k).toFixed(1)}" stroke-opacity="0"></circle>
      </g>`;

    return `${waves}<g class="stations">${stations}</g>
      <g transform="translate(${ex.toFixed(1)},${ey.toFixed(1)})">
        <g stroke="#FFFFFF" stroke-width="${(3.4 * k).toFixed(1)}" fill="none" opacity=".85">
          <circle r="${(6.5 * k).toFixed(1)}"></circle>
          <line x1="${(-13 * k).toFixed(1)}" y1="0" x2="${(13 * k).toFixed(1)}" y2="0"></line>
          <line x1="0" y1="${(-13 * k).toFixed(1)}" x2="0" y2="${(13 * k).toFixed(1)}"></line>
        </g>
        <circle r="${(12 * k).toFixed(1)}" fill="none" stroke="#11161B" stroke-width="${k.toFixed(1)}" opacity=".35"></circle>
        <circle r="${(6.5 * k).toFixed(1)}" fill="none" stroke="#11161B" stroke-width="${(1.6 * k).toFixed(1)}"></circle>
        <line x1="${(-13 * k).toFixed(1)}" y1="0" x2="${(13 * k).toFixed(1)}" y2="0" stroke="#11161B" stroke-width="${k.toFixed(1)}" opacity=".75"></line>
        <line x1="0" y1="${(-13 * k).toFixed(1)}" x2="0" y2="${(13 * k).toFixed(1)}" stroke="#11161B" stroke-width="${k.toFixed(1)}" opacity=".75"></line>
        <circle r="${(3 * k).toFixed(1)}" fill="#C4190B"></circle>
        ${inside ? '' : `<text class="maplabel" x="0" y="${(-18 * k).toFixed(1)}" text-anchor="middle" fill="#11161B" stroke="#FFFFFF" stroke-width="3" paint-order="stroke">${esc(state.lang === 'en' ? 'OFF MAP' : state.lang === 'ja' ? '範囲外' : '圖外')}</text>`}
      </g>
      <text class="wclock" x="${(proj.w - 12 * k).toFixed(1)}" y="${(18 * k).toFixed(1)}" text-anchor="end"></text>`;
  };
}

/* P and S fronts expanding from the epicenter at ×20 real time. A station
   lights up when the S front reaches ITS OWN reported EpicenterDistance. */
let waveRAF = null, waveGuard = null, waveLoopTimer = null;
const WAVE_HOLD_MS = 1700;      /* beat on the finished network before resetting */

function stopWaveLoop() {
  clearTimeout(waveLoopTimer); waveLoopTimer = null;
  if (waveRAF) { cancelAnimationFrame(waveRAF); waveRAF = null; }
  clearTimeout(waveGuard); waveGuard = null;
}
function finishWaves(svg, loop) {
  const target = svg || document.querySelector('.mapwrap svg');
  if (waveRAF) { cancelAnimationFrame(waveRAF); waveRAF = null; }
  clearTimeout(waveGuard); waveGuard = null;
  if (!target) return;
  target.classList.remove('waves-armed');
  target.querySelectorAll('.wavefront').forEach(w => w.setAttribute('r', 0));
  target.querySelectorAll('.waveg stop').forEach(st => st.setAttribute('stop-opacity', '0'));
  target.querySelectorAll('.wavefront').forEach(w => w.setAttribute('stroke-opacity', '0'));
  const clock = target.querySelector('.wclock'); if (clock) clock.textContent = '';
  /* Hold the all-lit network, then run it again — an audience needs more
     than one pass. Never queue another cycle while the tab is hidden. */
  clearTimeout(waveLoopTimer); waveLoopTimer = null;
  if (loop && state.waveLoop && !document.hidden && state.view === 'quake' && document.querySelector('.waveg')) {
    waveLoopTimer = setTimeout(playQuakeWaves, WAVE_HOLD_MS);
  }
}
function playQuakeWaves() {
  stopWaveLoop();
  const g = document.querySelector('.waveg');
  if (!g) return;
  const svg = g.closest('svg');
  const pxPerKm = parseFloat(g.getAttribute('data-waves')) || 1;
  const stns = [...svg.querySelectorAll('.stn')];
  const clock = svg.querySelector('.wclock');
  const pw = g.querySelector('.pwave'), sw = g.querySelector('.swave');
  const maxKm = Math.max(140, ...stns.map(x => parseFloat(x.getAttribute('data-sdist')) || 0));
  stns.forEach(x => x.classList.remove('hit'));
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { svg.classList.remove('waves-armed'); stns.forEach(x => x.classList.add('hit')); return; }
  svg.classList.add('waves-armed');
  const P = 6.0, S = 3.5, RATE = 20;
  const TRAIL_KM = 26;                    /* how far the pulse trails behind its front */
  const FADE_KM = maxKm * 1.25;           /* gone by the time it clears the network */
  const stops = sel => [...g.querySelectorAll('#' + sel + ' stop')];
  const gP = stops('wgP'), gS = stops('wgS');
  const paint = (circle, st, km, peak) => {
    const R = km * pxPerKm;
    circle.setAttribute('r', R.toFixed(1));
    if (!st.length) return;
    const fade = Math.max(0, 1 - km / FADE_KM);
    const a = peak * Math.pow(fade, 0.85);
    const tail = km > 0 ? Math.max(0, 1 - TRAIL_KM / km) : 0;
    st[1].setAttribute('offset', tail.toFixed(4));
    st[1].setAttribute('stop-opacity', '0');
    st[2].setAttribute('offset', (tail + (1 - tail) * 0.6).toFixed(4));
    st[2].setAttribute('stop-opacity', (a * 0.16).toFixed(3));
    st[3].setAttribute('stop-opacity', a.toFixed(3));
    st[4].setAttribute('stop-opacity', (a * 0.1).toFixed(3));
    circle.setAttribute('stroke-opacity', (a * 0.6).toFixed(3));   /* keeps the front crisp */
  };
  let t0 = null;
  const step = ts => {
    if (t0 == null) t0 = ts;
    const sec = (ts - t0) / 1000 * RATE;                 // seismic seconds
    paint(pw, gP, sec * P, 0.42);
    paint(sw, gS, sec * S, 0.8);
    if (clock) clock.textContent = 't + ' + sec.toFixed(1) + ' s';
    for (const x of stns) {
      if (!x.classList.contains('hit') && parseFloat(x.getAttribute('data-sdist')) <= sec * S) x.classList.add('hit');
    }
    if (sec * S < maxKm * 1.25) { waveRAF = requestAnimationFrame(step); }
    else { finishWaves(svg, true); }
  };
  /* If the frame clock stalls — backgrounded window, throttled tab — stop
     waiting and show the finished network rather than a dimmed one. */
  waveGuard = setTimeout(() => finishWaves(svg, true), 12000);
  waveRAF = requestAnimationFrame(step);
}

      <div class="card pad">
        <div class="micro" style="margin-bottom:8px">${esc(t('recentQuakes'))}</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px">${picker}</div>
      </div>
      <div class="card pad"><a href="${esc(q.web || '#')}" target="_blank" rel="noopener">${esc(t('openCwa'))} ↗</a>
        <div class="micro" style="margin-top:8px">${esc(q.dsId)}</div>
        ${rawBlock(q.raw, t('rawRecord'))}</div>
    </div>
  </div>
  <div class="disclaim">${esc(t('disclaimer'))}</div>`;
}

function typhoonCard(c, withMap) {
  const f = c.latest || {};
  const mapMeta = {};
  const mapSvg = withMap ? typhoonMap(c, 390, 330, mapMeta) : '';
  const st = c.stale ? t('stale') : c.near ? t('nearTaiwan') : t('farAway');
  let fields = '';
  fields += field(t('lastFix'), esc(fmtFull(f.time)) + ' · ' + esc(relTime(f.time, state.now)),
    { ds: DATASETS.typhoon.id, path: 'AnalysisData.Fix[last].DateTime', raw: f.raw && f.raw.DateTime });
  fields += field(t('distTaiwan'), `<span class="big">${c.distanceKm != null ? Math.round(c.distanceKm) : '—'}</span> ${esc(t('km'))}`,
    { computed: true, rule: rule('distanceCalc'),
      inputs: [{ label: 'centre lat/lon', value: `${f.lat}, ${f.lon}` }, { label: 'nearest county', value: c.nearestCode ? BY_CODE[c.nearestCode].zh : null }] });
  fields += field(t('bearingFromTw'), esc(dirLabel(c.bearingPoint)) + (c.bearing != null ? ` · ${Math.round(c.bearing)}°` : ''),
    { computed: true, rule: rule('bearingCalc') });
  fields += field(t('pressure'), esc(f.pressure != null ? f.pressure : '—') + ' hPa',
    { ds: DATASETS.typhoon.id, path: 'AnalysisData.Fix[last].Pressure', raw: f.raw && f.raw.Pressure, note: note('strNum') });
  fields += field(t('maxWind'), esc(f.wind != null ? f.wind : '—') + ' m/s',
    { ds: DATASETS.typhoon.id, path: 'AnalysisData.Fix[last].MaxWindSpeed', raw: f.raw && f.raw.MaxWindSpeed });
  fields += field(t('gust'), esc(f.gust != null ? f.gust : '—') + ' m/s',
    { ds: DATASETS.typhoon.id, path: 'AnalysisData.Fix[last].MaxGustSpeed', raw: f.raw && f.raw.MaxGustSpeed });
  fields += field(t('movement'),
    esc(state.lang === 'en'
      ? (f.prediction && f.prediction.en ? f.prediction.en
         : `${moveDirLabel(f.moveDir)}${f.moveSpeed != null ? ' · ' + f.moveSpeed + ' km/h' : ''}`)
      : (f.prediction && f.prediction.zh ? (state.lang === 'ja' ? toShinjitai(f.prediction.zh) : f.prediction.zh)
         : `${moveDirLabel(f.moveDir)}${f.moveSpeed != null ? ' · ' + f.moveSpeed + ' km/h' : ''}`)),
    { ds: DATASETS.typhoon.id, path: 'AnalysisData.Fix[last].MovingPrediction[]', raw: f.raw && f.raw.MovingPrediction,
      note: state.lang === 'en' ? note('officialMove') : null }, 'txt');
  fields += field(t('radius15'), esc(f.r15 != null ? f.r15 : '—') + ' ' + esc(t('km')),
    { ds: DATASETS.typhoon.id, path: 'AnalysisData.Fix[last].Circle15ms.Radius', raw: f.raw && f.raw.Circle15ms && f.raw.Circle15ms.Radius });
  fields += field(t('radius25'), esc(f.r25 != null ? f.r25 : '—') + ' ' + esc(t('km')),
    { ds: DATASETS.typhoon.id, path: 'AnalysisData.Fix[last].Circle25ms.Radius', raw: f.raw && f.raw.Circle25ms && f.raw.Circle25ms.Radius });

  const fc = c.forecast.map(x => `<div class="field"><div class="row">
      <span class="k">+${x.hour}H · ${esc(fmtDT(x.time))}</span>
      <span class="v">${x.lat}N ${x.lon}E${x.pressure != null ? ' · ' + x.pressure + ' hPa' : ''}${x.wind != null ? ' · ' + x.wind + ' m/s' : ''}</span></div>
      ${x.stateTransfer && (x.stateTransfer.en || x.stateTransfer.zh) ? `<div class="note">${esc(state.lang === 'en' ? (x.stateTransfer.en || x.stateTransfer.zh) : state.lang === 'ja' ? toShinjitai(x.stateTransfer.zh || '') : (x.stateTransfer.zh || ''))}</div>` : ''}
    </div>`).join('');

  return `${withMap ? `<div class="mapwrap">
      <div class="maphead">
        <span class="micro">${esc(t('trackObserved'))} ━ · ${esc(t('trackForecast'))} ╌</span>
        <span class="micro">15 / 25 m/s</span></div>
      ${mapSvg}
      ${mapMeta.offFrame ? `<div class="legend" style="display:block">${esc(t('towardStorm', { name: cycloneName(c),
        d: c.distanceKm != null ? Math.round(c.distanceKm) : '?', dir: dirLabel(c.bearingPoint) }))}</div>` : ''}
    </div>` : ''}
    <div class="status" style="margin-top:12px"><span class="sevchip ${c.near ? 'sev-warning' : 'sev-info'}">${esc(c.near ? sevLabel('warning') : sevLabel('info'))}</span><div>${esc(st)}</div></div>
    ${annot({ computed: true, rule: c.proximityBasis.rule, inputs: c.proximityBasis.inputs })}
    <div class="status" style="margin-top:10px"><div>${esc(t('noWarnFlag'))}</div></div>
    <div class="card pad" style="margin-top:12px">${fields}</div>
    <div class="card pad" style="margin-top:12px">
      <div class="micro" style="margin-bottom:6px">${esc(t('forecastPositions'))}</div>${fc || '<div class="note">—</div>'}
      ${annot({ ds: DATASETS.typhoon.id, path: 'ForecastData.Fix[]', raw: 'InitialTime + ForecastHour', note: note('forecastValid') })}
    </div>`;
}
function viewTyphoon() {
  if (state.ds.typhoon.status === 'loading') return `<div class="card pad note">${esc(t('loading'))}</div>`;
  if (!state.cyclones.length) {
    return `<div class="card pad"><div style="font-size:15px">${esc(t('noCyclone'))}</div>
      <div class="note" style="margin-top:8px">${esc(t('basinNote'))}</div></div>${dataPanel()}
      <div class="disclaim">${esc(t('disclaimer'))}</div>`;
  }
  const c = state.cyclones[state.cycloneIdx] || state.cyclones[0];
  const picker = state.cyclones.length > 1 ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">${
    state.cyclones.map((x, i) => `<button class="chip ${i === state.cycloneIdx ? 'me' : ''}" data-cyclone="${i}" style="padding:6px 9px">${esc(cycloneName(x))}</button>`).join('')}</div>` : '';
  return `${picker}
    <div class="hero sev-${c.near ? 'warning' : 'info'}"><div class="bar"></div><div style="min-width:0">
      <div class="micro">${esc(t('navTyphoon'))} ${c.tyNo ? '· No.' + esc(c.tyNo) : ''} ${c.year ? '· ' + esc(c.year) : ''}</div>
      <div class="word">${esc(cycloneName(c))}</div>
      <div class="where">${esc(t('distTaiwan'))} ${c.distanceKm != null ? Math.round(c.distanceKm) : '—'} ${esc(t('km'))} · ${esc(dirLabel(c.bearingPoint))}</div>
    </div></div>
    ${typhoonCard(c, true)}
    ${guidanceBlock('typhoon')}
    <div class="card pad" style="margin-top:12px">
      <div class="micro" style="margin-bottom:6px">${esc(t('cyclones'))}</div>
      <div class="note">${esc(t('basinNote'))}</div>
      <div style="margin-top:8px"><a href="https://www.cwa.gov.tw/V8/${state.lang === 'en' ? 'E' : 'C'}/P/Typhoon/TY_NEWS.html" target="_blank" rel="noopener">${esc(t('openCwa'))} ↗</a></div>
      <div class="micro" style="margin-top:8px">${esc(DATASETS.typhoon.id)}</div>
      ${rawBlock(c.raw, t('rawRecord'))}
    </div>
    <div class="disclaim">${esc(t('disclaimer'))}</div>`;
}

/* ------------------------- 9. SHELL + BOOT -------------------------- */

const NAV_ICONS = {
  home: '<svg viewBox="0 0 24 24"><path d="M4 20V9l8-5 8 5v11"/><path d="M9 20v-6h6v6"/></svg>',
  quake: '<svg viewBox="0 0 24 24"><path d="M2 12h3l2-6 3 12 3-15 3 15 2-6h4"/></svg>',
  typhoon: '<svg viewBox="0 0 24 24"><path d="M12 12c4-4 9-2 9 2s-6 5-9 2-1-9 3-9"/><circle cx="12" cy="12" r="1.6"/></svg>'
};
/* Presentation mode: one map, one number, nothing else. */
function viewStage() {
  let sev = 'none', word = '', where = '', legend = '', map = '';
  if (state.view === 'quake') {
    const q = state.quakes.find(x => x.id === state.quakeId) || state.quakes[0];
    if (q) {
      sev = q.severity; word = 'M ' + (q.magnitude != null ? q.magnitude.toFixed(1) : '—');
      where = epicenterLabel(q.epicenter) + ' · ' + t('maxIntensity') + ' ' + intensityLabel(q.maxIdx);
      const fills = new Map([...q.intensityByCounty].map(([c, i]) => [c, INTENSITY_COLOR[i]]));
      const halo = new Map([...q.intensityByCounty].filter(([, i]) => i >= 4)
        .map(([c, i]) => [c, { color: INTENSITY_COLOR[i], pulse: i >= 5 }]));
      map = taiwanAlertMap(fills, state.county, { halo, animate: state.animate, extra: quakeExtra(q) });
      legend = intensityLegend();
    }
  } else if (state.view === 'typhoon') {
    const c = state.cyclones[state.cycloneIdx] || state.cyclones[0];
    if (c) {
      sev = c.near ? 'warning' : 'info'; word = cycloneName(c);
      where = t('distTaiwan') + ' ' + (c.distanceKm != null ? Math.round(c.distanceKm) : '—') + ' ' + t('km') + ' · ' + dirLabel(c.bearingPoint);
      const sz = mapSize();
      map = typhoonMap(c, sz.W, sz.H, {});
    }
  }
  if (!map) {
    const sevMap = severityByCounty();
    const mine = activeAlerts().filter(a => a.affectedRegions.includes(state.county));
    sev = mine.length ? worstOf(mine.map(a => a.severity)) : 'none';
    word = sev === 'none' ? t('sev.none') : sevLabel(sev);
    where = countyLabel(state.county) + (mine.length ? ' · ' + t('nActive', { n: mine.length }) : '');
    map = taiwanAlertMap(new Map([...sevMap].map(([c, x]) => [c, sevHex(x)])), state.county, {
      animate: state.animate,
      halo: new Map([...sevMap].map(([c, x]) => [c, { color: sevHex(x), pulse: x === 'severe' }]))
    });
    legend = `<div class="legend">${['severe','warning','advisory','info'].map(x =>
      `<span class="li"><span class="sw" style="background:${sevHex(x)}"></span>${esc(sevLabel(x))}</span>`).join('')}
      <span class="li"><span class="sw" style="background:var(--none)"></span>${esc(t('legendNone'))}</span></div>`;
  }
  return `<div class="stagebar sev-${sev === 'none' ? 'none' : sev}">
      <div class="bar"></div>
      <div><div class="word"${sev === 'none' ? ' style="color:var(--ink)"' : ''}>${esc(word)}</div>
        <div class="where">${esc(where)}</div></div>
      <div class="right"><div class="stagekey">${esc(t('liveNow'))}</div>
        <div class="where">${esc(fmtFull(state.now))}</div></div>
    </div>
    <div class="mapwrap">${map}</div>
    <div class="stagefoot">${legend}<span class="stagekey">${esc(t('stageHint'))}</span></div>`;
}
function renderHeader() {
  const seg = document.getElementById('langSeg');
  seg.innerHTML = LANGS.map(([code, label]) =>
    `<button data-lang="${code}" aria-pressed="${state.lang === code}">${esc(label)}</button>`).join('');
  document.getElementById('srcLabel').textContent = state.source ? t('hideSource') : t('showSource');
  document.getElementById('srcBtn').setAttribute('aria-pressed', String(state.source));
  document.getElementById('brandSub').textContent = t('brandSub');
  document.documentElement.lang = state.lang === 'zh' ? 'zh-Hant' : state.lang;
  document.getElementById('nav').innerHTML = ['home', 'quake', 'typhoon'].map(v => {
    const key = v === 'home' ? 'navHome' : v === 'quake' ? 'navQuake' : 'navTyphoon';
    const cur = state.view === v || (v === 'home' && state.view === 'detail');
    return `<button data-nav="${v}" aria-current="${cur ? 'page' : 'false'}">${NAV_ICONS[v]}<span>${esc(t(key))}</span></button>`;
  }).join('');
}
function render() {
  state.now = new Date();
  document.body.classList.toggle('src', state.source);
  document.body.classList.toggle('stage', state.stage);
  const el = document.getElementById('view');
  /* Replay the reveal when the view or the data changes — never on the
     one-minute clock tick, which would make the map twitch forever. */
  const loaded = Object.keys(DATASETS).filter(k => state.ds[k].status === 'ok').length;
  const key = state.view + ':' + loaded + ':' + (state.stage ? 's' : '') + ':' + state.lang;
  state.animate = key !== state.animKey;
  state.animKey = key;
  const html = state.stage ? viewStage()
    : state.view === 'detail' ? viewDetail()
    : state.view === 'quake' ? viewQuake()
    : state.view === 'typhoon' ? viewTyphoon() : viewHome();
  el.innerHTML = html;
  renderHeader();
  clearTimeout(riseFailsafe);
  riseFailsafe = setTimeout(dropReveal, 1400);
  /* innerHTML replaced the nodes the loop was driving, so re-arm it here:
     this covers entering the tab, the one-minute tick and stage toggles. */
  stopWaveLoop();
  if (state.view === 'quake' && document.querySelector('.waveg')) {
    if (state.waveLoop) waveLoopTimer = setTimeout(playQuakeWaves, state.animate ? 420 : 120);
  }
}
let riseFailsafe = null;
const dropReveal = () => document.querySelectorAll('.county.rise').forEach(el => el.classList.remove('rise'));
function save() {
  try { localStorage.setItem('tw-alert', JSON.stringify({ lang: state.lang, county: state.county, source: state.source })); } catch (e) {}
}
function go(view) { state.view = view; render(); window.scrollTo({ top: 0, behavior: 'instant' in document.documentElement.style ? 'instant' : 'auto' }); }

function wire() {
  document.addEventListener('click', e => {
    const hit = sel => e.target.closest && e.target.closest(sel);
    let el;
    if ((el = hit('[data-lang]'))) { state.lang = el.getAttribute('data-lang'); save(); render(); return; }
    if ((el = hit('#srcBtn'))) { state.source = !state.source; save(); render(); return; }
    if ((el = hit('[data-nav]'))) { go(el.getAttribute('data-nav')); return; }
    if ((el = hit('[data-retry]'))) { fetchDataset(el.getAttribute('data-retry')); return; }
    if ((el = hit('[data-action="refresh"]'))) { loadAll(); return; }
    if ((el = hit('[data-action="waves"]'))) {
      state.waveLoop = !state.waveLoop;
      if (state.waveLoop) { render(); playQuakeWaves(); }
      else { stopWaveLoop(); finishWaves(); render(); }
      return;
    }
    if ((el = hit('[data-action="now"]'))) {
      state.previewMs = 0;
      const r = document.querySelector('[data-action="scrub"]'); if (r) r.value = 0;
      render(); return;
    }
    if ((el = hit('[data-action="back"]'))) { go('home'); return; }
    if ((el = hit('[data-quake]'))) { state.quakeId = el.getAttribute('data-quake'); go('quake'); return; }
    if ((el = hit('[data-cyclone]'))) { state.cycloneIdx = +el.getAttribute('data-cyclone'); render(); return; }
    if ((el = hit('[data-alert]'))) { state.alertId = el.getAttribute('data-alert'); go('detail'); return; }
    if ((el = hit('[data-county]'))) { state.county = el.getAttribute('data-county'); save(); render(); return; }
  });
  document.addEventListener('keydown', e => {
    const tag = (e.target && e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
    if (e.key === 'p' || e.key === 'P') { state.stage = !state.stage; render(); return; }
    if (e.key === 'Escape' && state.stage) { state.stage = false; render(); return; }
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const el = e.target.closest && e.target.closest('[data-county]');
    if (el) { e.preventDefault(); state.county = el.getAttribute('data-county'); save(); render(); }
  });
  document.addEventListener('change', e => {
    const el = e.target.closest && e.target.closest('select[data-action="county"]');
    if (el) { state.county = el.value; save(); render(); return; }
    if (e.target.closest && e.target.closest('[data-action="scrub"]')) render();   /* settle the stream on release */
  });
  document.addEventListener('input', e => {
    const r = e.target.closest && e.target.closest('[data-action="scrub"]');
    if (!r) return;
    state.previewMs = (+r.value / 1000) * (+r.getAttribute('data-span') || 0);
    applyPreview();
  });
}
function boot() {
  try {
    const raw = localStorage.getItem('tw-alert');
    if (raw) { const o = JSON.parse(raw);
      if (o.lang && LANGS.some(l => l[0] === o.lang)) state.lang = o.lang;
      if (o.county && BY_CODE[o.county]) state.county = o.county;
      state.source = !!o.source; }
  } catch (e) {}
  wire();
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { stopWaveLoop(); return; }
    dropReveal();
    finishWaves();
    if (state.waveLoop && state.view === 'quake' && document.querySelector('.waveg')) playQuakeWaves();
  });
  rebuild();
  render();
  loadAll();
  let rt = null;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { state.animKey = ''; render(); }, 180); });
  setInterval(() => { state.now = new Date(); if (state.view !== 'detail') render(); }, 60000);
  setInterval(loadAll, 300000);
}
if (typeof document !== 'undefined' && typeof window !== 'undefined') {
  document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', boot) : boot();
} else if (typeof module !== 'undefined') {
  module.exports = { state, rebuild, parseCwaTime, parseEpicenter, quakeSeverity, weatherSeverity,
    buildWeatherAlerts, buildQuakes, buildCyclones, resolveRegion, intensityIndex, INTENSITY_SCALE,
    distanceToTaiwan, makeProjection, featurePath, TW_GEO, COUNTIES, activeAlerts, severityByCounty,
    alertHeadline, alertBody, regionNames, countyLabel, t, DATASETS, typhoonMap, taiwanAlertMap, num, haversine };
}
</script>
